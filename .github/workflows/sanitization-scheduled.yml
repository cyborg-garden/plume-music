name: sanitization-scheduled

# Full-tree audit, the backstop for the diff-only PR gate: a release is a tree,
# not a diff. Runs weekly and on demand.

on:
  schedule:
    - cron: '41 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanitize-full-tree:
    uses: cyborg-garden/swarm-map/.github/workflows/sanitization-gate.yml@sanitization-gate-v1.1.0
    with:
      mode: full-tree
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
