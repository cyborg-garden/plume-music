name: tests

# The whole suite, on macOS, Linux and Windows, with Python 3.11 and 3.12.
#
# No runner has an audio device, and no test may open one: live paths run on the
# fake device in tests/conftest.py, and PLUME_ALLOW_AUDIO is never set here.
#
# The suite takes most of an hour on one core, so each OS and Python runs it as
# four shards (PLUME_TEST_SHARD, see tests/conftest.py).  Together the four run
# every test once; none is a subset.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
        shard: ["1/4", "2/4", "3/4", "4/4"]
    env:
      PLUME_TEST_SHARD: ${{ matrix.shard }}
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # PortAudio and libsndfile, so sounddevice and soundfile import on Linux.
      # macOS and Windows wheels bundle their own.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libportaudio2 libsndfile1

      # node runs the gui page's own logic tests; they skip without it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[midi]" pytest

      - name: Test
        shell: bash
        run: |
          unset PLUME_ALLOW_AUDIO
          python -m pytest -p no:cacheprovider -q -rs
